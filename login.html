<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Premium Loading Animation -->
    <div id="cyber-loader">
        <div class="loader-ring"><div></div><div></div></div>
        <div class="loader-text">INITIALIZING SECURE CONNECTION...</div>
    </div>

    <header class="sticky-header neon-navbar">
        <div class="container flex-center" style="justify-content: space-between; padding: 15px 20px;">
            <h1 class="text-neon" style="font-size: 1.6rem; letter-spacing: 3px;">
                <a href="index.html" style="text-decoration:none; color:inherit;">CYBER<span style="color:white">VAULT</span></a>
            </h1>
            <nav>
                <a href="index.html" class="animated-underline" style="margin-right: 20px;">Home</a>
                <a href="signup.html" class="gradient-btn cyber-btn">Sign Up</a>
            </nav>
        </div>
    </header>

    <section class="hero-section" style="min-height: 85vh;">
        <div class="container">
            <div class="cyber-hud fade-in-up" style="max-width: 450px; margin: 0 auto; padding: 40px;">
                <h2 class="text-neon" style="text-align: center; margin-bottom: 10px;">ACCESS TERMINAL</h2>
                <p style="text-align: center; color: var(--text-secondary); margin-bottom: 30px; font-size: 0.9rem;">Authenticate to access the CyberVault lab environment.</p>
                
                <form id="loginForm">
                    <div class="floating-label-group">
                        <input type="email" id="loginEmail" placeholder=" " required>
                        <label for="loginEmail">Email Address</label>
                    </div>
                    <div class="floating-label-group">
                        <input type="password" id="loginPassword" placeholder=" " required>
                        <label for="loginPassword">Password</label>
                    </div>
                    <button type="submit" class="gradient-btn cyber-btn" style="width: 100%; margin-bottom: 24px;">Authenticate</button>
                </form>

                <div class="section-divider" style="margin: 24px 0; display: flex; align-items: center; text-align: center;">
                    <span style="flex: 1; border-top: 1px solid rgba(255,255,255,0.1);"></span>
                    <span style="padding: 0 15px; color: var(--text-secondary); font-size: 0.8rem; font-family: var(--font-mono);">OR CONTINUE WITH</span>
                    <span style="flex: 1; border-top: 1px solid rgba(255,255,255,0.1);"></span>
                </div>

                <button id="googleLogin" class="neon-btn cyber-btn" style="width: 100%; margin-bottom: 12px;">Google</button>
                <button id="appleLogin" class="neon-btn cyber-btn" style="width: 100%; margin-bottom: 12px;">Apple</button>
                <button id="microsoftLogin" class="neon-btn cyber-btn" style="width: 100%;">Microsoft</button>

                <p style="text-align: center; margin-top: 30px; color: var(--text-secondary); font-size: 0.9rem;">
                    No access credentials? <a href="signup.html" class="text-neon" style="text-decoration: none;">Request Access</a>
                </p>
            </div>
        </div>
    </section>

    <footer class="cyber-footer">
        <div class="container">
            <p style="color: var(--text-secondary); font-size: 0.85rem; font-family: var(--font-mono);">
                &copy; 2026 CYBERVAULT. DEVELOPED BY <strong class="text-neon">ANUGA SENITHU</strong>
            </p>
        </div>
    </footer>

    <!-- Loader Dismissal Script -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('cyber-loader').classList.add('hidden');
            }, 800); // 800ms minimum load time for smooth effect
        });
    </script>
    <script type="module" src="auth.js"></script>
</body>
</html>
