<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CyberVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="responsive-cyber-layout">
        <!-- 69. Vertical Navigation -->
        <aside class="vertical-nav">
            <h2 class="text-neon" style="margin-bottom: 30px; font-size: 1.5rem;">CYBERVAULT</h2>
            <nav style="display: flex; flex-direction: column; gap: 15px;">
                <a href="dashboard.html" class="active-nav-glow" style="padding: 10px; border-radius: 4px; color: white; text-decoration: none;">📊 Dashboard</a>
                <a href="#" style="padding: 10px; border-radius: 4px; color: var(--text-secondary); text-decoration: none;">🛠️ All Tools</a>
                <a href="#" style="padding: 10px; border-radius: 4px; color: var(--text-secondary); text-decoration: none;">🎓 Learning Labs</a>
                <a href="#" style="padding: 10px; border-radius: 4px; color: var(--text-secondary); text-decoration: none;">⚙️ Settings</a>
                <div style="margin-top: auto;">
                    <button id="logoutBtn" class="neon-btn cyber-btn" style="width: 100%;">Logout</button>
                </div>
            </nav>
        </aside>

        <main style="padding: 20px; overflow-y: auto; height: 100vh;">
            <header class="sticky-header" style="position: sticky; top: 0; z-index: 100; background: rgba(10, 10, 15, 0.95); padding: 15px 20px; border-radius: 8px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
                <h2 class="text-gradient">Tools Dashboard</h2>
                <!-- 86. Search Input Glow -->
                <input type="text" id="toolSearch" class="search-input-glow" placeholder="Search 100+ cyber tools..." style="max-width: 300px;">
            </header>

            <!-- 92. 3D Dashboard -->
            <div class="dashboard-3d" style="margin-bottom: 30px;">
                <div class="grid-layout" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                    <div class="dashboard-panel stats-card">
                        <div class="number">100</div>
                        <div style="color: var(--text-secondary);">Total Tools</div>
                    </div>
                    <div class="dashboard-panel stats-card">
                        <div class="number" style="color: var(--neon-green);">Active</div>
                        <div style="color: var(--text-secondary);">Serverless Status</div>
                    </div>
                    <div class="dashboard-panel stats-card">
                        <div class="number" style="color: var(--neon-purple);">A+</div>
                        <div style="color: var(--text-secondary);">Security Grade</div>
                    </div>
                </div>
            </div>

            <!-- 99. Interactive Tool Cards Grid -->
            <div id="toolsGrid" class="grid-layout"></div>
        </main>

        <!-- Right Sidebar -->
        <aside style="padding: 20px; border-left: 1px solid #333; display: none;" id="rightSidebar">
            <div style="text-align: center; margin-bottom: 30px;">
                <h4 class="text-neon" style="margin-bottom: 15px;">System Radar</h4>
                <!-- 96. Cyber Radar -->
                <div class="cyber-radar" style="margin: 0 auto;"></div>
            </div>
            <div style="text-align: center; margin-bottom: 30px;">
                <h4 class="text-neon" style="margin-bottom: 15px;">Lab Completion</h4>
                <!-- 97. Circular Progress UI -->
                <div class="circular-progress" style="margin: 0 auto;"><span>75%</span></div>
            </div>
            <div style="margin-bottom: 30px;">
                <h4 class="text-neon" style="margin-bottom: 15px;">Tool Usage</h4>
                <!-- 98. Neon Data Visualization -->
                <div class="neon-chart">
                    <div class="chart-bar" style="height: 40%;"></div>
                    <div class="chart-bar" style="height: 70%;"></div>
                    <div class="chart-bar" style="height: 50%;"></div>
                    <div class="chart-bar" style="height: 90%;"></div>
                    <div class="chart-bar" style="height: 60%;"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 89. Notification Toast -->
    <div id="notificationToast" class="notification-toast">
        <span id="toastMessage">Operation successful</span>
    </div>

    <footer class="cyber-footer" style="margin-top: 0; border-top: 1px solid #333;">
        <div class="container">
            <p style="color: var(--text-secondary); font-size: 0.9rem;">&copy; 2026 CyberVault. Developed by <strong class="text-neon">Anuga Senithu</strong> | Hosted on Vercel</p>
        </div>
    </footer>

    <script src="tools.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
